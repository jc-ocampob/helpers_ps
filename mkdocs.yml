site_name: Helpers PS
site_url: https://jc-ocampob.github.io/Helpers_PS/
site_description: Documentación interna del paquete Helpers PS
site_author: Equipo de Soluciones de Portafolio

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Index: index.md
  
  - Instalation: install_guide.md
  
  - GraphMtplt:
    - Getting Started: GraphMtplt/getting_started.md
    
    - Line Chart: 
      - Graph: GraphMtplt/Line/graph.md
      - Tags: GraphMtplt/Line/tags.md
      
    - Bar Chart:
      - Graph: GraphMtplt/Bar/graph.md
    
    - Pie Chart:
      - Graph: GraphMtplt/Pie/graph.md

    - Box Whiskers Chart:
      - Graph: GraphMtplt/Box/graph.md

  - FinCalculations:
    - Getting Started: FinCalculations/getting_started.md
  
  - Ejemplos:
    - Línea último valor: examples/line_last_value.md
    - Barras stacked: examples/bar_stacked.md
    - Box Whiskers: examples/box_whiskers.md
  - API:
    - Gráficos: api/graph_mtplt.md
    - Funciones de Ayuda: api/helpers.md
